name: Android app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web app and copy it into Android
        run: |
          npm ci --ignore-scripts
          npm run build
          npx cap sync android

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "AURUM_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "AURUM_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AURUM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aurum-release.p12"
            echo "AURUM_KEYSTORE_PATH=$RUNNER_TEMP/aurum-release.p12" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Releases need the AURUM_KEYSTORE_BASE64 and AURUM_KEYSTORE_PASSWORD secrets."
            exit 1
          else
            echo "::warning::No signing key secret set, so this build uses a temporary debug key. Install it only for testing."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          AURUM_KEYSTORE_PASSWORD: ${{ secrets.AURUM_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            APK=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew --no-daemon assembleDebug
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          mkdir -p ../dist
          cp "$APK" "../dist/Aurum-${AURUM_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Aurum-${{ env.AURUM_VERSION_NAME }}
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Aurum ${{ env.AURUM_VERSION_NAME }}
          files: dist/*.apk
          body: |
            Download **Aurum-${{ env.AURUM_VERSION_NAME }}.apk** below and open it on your Android phone to install.
            Your data stays on your phone. Export a backup from Settings before uninstalling or changing phone.
